name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 本插件是零依赖的，所以 CI 不需要 pnpm install —— 直接跑断言套件。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 离线断言套件：产物契约 / 纯函数 / 注册契约 / 数据路径的成败两条路
      - name: Offline assertions
        run: node test/run.mjs

      # 推送助手的决策逻辑：用假的 git 与假的 GitHub API 跑，不联网、不碰真仓库。
      # 这是回归测试 —— 它曾在"没有 origin"（首次推送的常态）时直接崩过。
      - name: Push helper logic
        run: node test/push-logic.test.mjs

      # 真 git() 函数的返回值与错误处理（猴补丁 execFileSync）。
      # 回归测试：inherit 模式下 execFileSync 返回 null，曾经 .trim() 抛错，
      # 把**已经成功**的推送误报成失败。
      - name: Push helper git() contract
        run: node test/push-git.test.mjs

      # 预检：在 CI 上没有安装 DSH，所以官方产物找不到 —— 相关项会**如实跳过**
      # 并把跳过原因打印出来，退出码仍是 0。它在这里的价值是守住本包自己的清单与产物契约。
      - name: Contract preflight
        run: node test/preflight.mjs

      # 发布自检：占位符 / private / 依赖 / files 白名单 / 产物一致性。
      # 在 CI 上应当全过（仓库里已填好用户名）；不过也不阻断，真正的把关点在本地。
      - name: Publish readiness
        run: node test/publish-check.mjs
        continue-on-error: true
